name: Build TempRoot

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias dirtyfrag \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dirtyfrag -keypass dirtyfrag \
            -dname "CN=TempRoot, OU=TempRoot, O=TempRoot, L=NA, ST=NA, C=NA" >/dev/null

      - name: Build DirtyFrag APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: temproot-apk
          path: app/build/outputs/apk/release/dirtyfrag.apk
