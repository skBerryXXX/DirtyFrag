name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate custom signing key
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias dirtyfrag \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dirtyfrag -keypass dirtyfrag \
            -dname "CN=TempRootCustom, OU=Custom, O=Custom, L=NA, ST=NA, C=NA" >/dev/null
          ls -l keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: custom-keystore
          path: keystore.jks
